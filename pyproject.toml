[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batch-intake"
version = "0.1.0"
description = "Partner batch intake pipeline"
requires-python = ">=3.10"
dependencies = [
    "chevron>=0.14,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "black>=24",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-chevron>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/batch_intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
